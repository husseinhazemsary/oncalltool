<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Orange On-Call
    </title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,.1);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #777;
            margin-bottom: 30px;
        }

        a {
            display: block;
            padding: 15px;
            margin-top: 15px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .employee {
            background: #ff7900;
            color: white;
        }

        .manager {
            background: #222;
            color: white;
        }
    </style>

</head>


<body>


    <div class="login-box">

        <h1>
            Orange On-Call
        </h1>

        <p>
            Select dashboard
        </p>


        <a class="employee"
           href="/employee/employee.html">

            Employee Dashboard

        </a>


        <a class="manager"
           href="/admin/admin.html">

            Manager Dashboard

        </a>


    </div>


</body>

</html>
